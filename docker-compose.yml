services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: organizador
      POSTGRES_PASSWORD: organizador
      POSTGRES_DB: organizador
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U organizador"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  email-service:
    build:
      context: .
      dockerfile: services/email-service/Dockerfile
    environment: &app_env
      DATABASE_URL: postgresql+psycopg2://organizador:organizador@postgres:5432/organizador
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  pdf-service:
    build:
      context: .
      dockerfile: services/pdf-service/Dockerfile
    environment: *app_env
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  organizer-service:
    build:
      context: .
      dockerfile: services/organizer-service/Dockerfile
    environment: *app_env
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      <<: *app_env
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: services/frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - gateway

volumes:
  pgdata:
